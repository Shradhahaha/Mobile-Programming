<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Realtime Console Test</title>
</head>
<body>
    <h1>Contact Us</h1>
    <form id="contactForm">
        <label for="userId">User ID:</label>
        <input type="text" id="userId" name="userId" required>
        <br><br>
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required>
        <br><br>
        <label for ="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" required>    
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="address">Address:</label>
        <input type="text" id="address" name="address" required>
        <br><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required>
        <br><br>
        <button type="submit" onclick="event.preventDefault();   // when using button type submit, it will refresh the page, so we prevent that default behavior
        submitContact(
            document.getElementById('userId').value,
            document.getElementById('firstName').value,
            document.getElementById('lastName').value,
            document.getElementById('email').value,
            document.getElementById('address').value,
            document.getElementById('phone').value
        )">Submit</button>
    </form>

    <button></button>

    <script type="module" src="contact.js"></script>


</body>
</html>
