<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
</head>
<body>

  <h1>Contact Us</h1>

  <input type="text" id="name" placeholder="Your Name"><br><br>
  <input type="email" id="email" placeholder="Your Email"><br><br>
  <textarea id="message" placeholder="Your Message"></textarea><br><br>

  <button onclick="submitContact()">Send Message</button>

  <h2>All Messages (Admin View)</h2>
  <button onclick="getMessages()">Load Messages</button>
  <ul id="messageList"></ul>

  <script type="module" src="contact.js"></script>
</body>
</html>
