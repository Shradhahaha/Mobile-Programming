<!DOCTYPE html>
<html>
<body>

<h1>My JavaScript Buttons</h1>

<div>
<button onclick="document.getElementById('text').style.fontSize='35px'">
Increase Font Size
</button>
</div>

<div>
<button onclick="document.getElementById('text').style.fontSize='15px'">
Decrease Font Size
</button>
</div>

<div>
<button onclick="document.getElementById('text').style.color='blue'">
Change Text Color
</button>
</div>

<div>
<button onclick="document.body.style.backgroundColor='lightyellow'">
Change Background Color
</button>
</div>

<div>
<button onclick="document.getElementById('img').src='C:/Users/shrad/OneDrive/Desktop/cat.jpg'">
Show Cat Image
</button>
</div>

<div>
<button onclick="document.getElementById('img').style.display='none'">
Hide Image
</button>
</div>

<div>
<button onclick="document.getElementById('img').style.display='block'">
Show Image
</button>
</div>

<div>
<button onclick="document.getElementById('text').innerHTML='The text has been changed!'">
Change Text
</button>
</div>

<div>
<button onclick="alert('Hello! This is a JavaScript alert.')">
Show Alert
</button>
</div>

<div>
<button onclick="location.reload()">
Reset Page
</button>
</div>

<p id="text">This is a sample text.</p>

<br>

<img id="img" src="C:/Users/shrad/OneDrive/Desktop/cat.jpg" width="300">

</body>
</html>
