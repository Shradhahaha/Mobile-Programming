<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Arithmetic Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        .container {
            margin-top: 50px;
        }

        .calculator {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        input {
            margin: 10px;
            padding: 10px;
            width: 200px;
        }

        button {
            margin: 5px;
            padding: 10px 15px;
            cursor: pointer;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Simple Calculator</h1>

    <div class="calculator">
        <input type="number" id="num1" placeholder="First Number"><br>
        <input type="number" id="num2" placeholder="Second Number"><br>

        <button onclick="calculate('+')">Add</button>
        <button onclick="calculate('-')">Subtract</button><br>
        <button onclick="calculate('*')">Multiply</button>
        <button onclick="calculate('/')">Divide</button>

        <p id="result"></p>
    </div>
</div>

<script>
    function calculate(operator) {
        let num1 = parseFloat(document.getElementById("num1").value);
        let num2 = parseFloat(document.getElementById("num2").value);
        let result;

        // Validation
        if (isNaN(num1) || isNaN(num2)) {
            document.getElementById("result").innerText = "Please enter both numbers.";
            return;
        }

        switch (operator) {
            case '+':
                result = num1 + num2;
                break;
            case '-':
                result = num1 - num2;
                break;
            case '*':
                result = num1 * num2;
                break;
            case '/':
                if (num2 === 0) {
                    document.getElementById("result").innerText = "Cannot divide by zero!";
                    return;
                }
                result = num1 / num2;
                break;
        }

        document.getElementById("result").innerText = "Result: " + result;
    }
</script>

</body>
</html>
